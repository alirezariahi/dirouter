<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-labelledby="t d">
  <title id="t">DiRouter contribution flow</title>
  <desc id="d">Animated pipeline from card to merged change: branch, commit hooks, pull request, CI, review, merge, and image publication.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#b8432b"/>
      <stop offset="1" stop-color="#2b5db8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="220" rx="16" fill="#fbf8f4"/>
  <path id="rail" d="M70 110 L890 110" stroke="#d8d1c7" stroke-width="4" fill="none"/>
  <path d="M70 110 L890 110" stroke="url(#g)" stroke-width="4" fill="none" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="3s" repeatCount="indefinite"/>
  </path>
  <g font-family="Vazirmatn, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f1d1a">
    <g>
      <circle cx="70" cy="110" r="22" fill="#fff" stroke="#b8432b" stroke-width="3"/>
      <text x="70" y="158">Card</text>
    </g>
    <g>
      <circle cx="210" cy="110" r="22" fill="#fff" stroke="#b8432b" stroke-width="3"/>
      <text x="210" y="158">Branch</text>
    </g>
    <g>
      <circle cx="350" cy="110" r="22" fill="#fff" stroke="#b8432b" stroke-width="3"/>
      <text x="350" y="158">Hooks</text>
    </g>
    <g>
      <circle cx="490" cy="110" r="22" fill="#fff" stroke="#b8432b" stroke-width="3"/>
      <text x="490" y="158">Pull request</text>
    </g>
    <g>
      <circle cx="630" cy="110" r="22" fill="#fff" stroke="#b8432b" stroke-width="3"/>
      <text x="630" y="158">CI + review</text>
    </g>
    <g>
      <circle cx="770" cy="110" r="22" fill="#fff" stroke="#b8432b" stroke-width="3"/>
      <text x="770" y="158">Merge</text>
    </g>
    <g>
      <circle cx="890" cy="110" r="22" fill="#b8432b"/>
      <text x="890" y="158">GHCR</text>
    </g>
  </g>
  <circle r="6" fill="#b8432b">
    <animateMotion dur="5s" repeatCount="indefinite" path="M70 110 L890 110"/>
  </circle>
</svg>
