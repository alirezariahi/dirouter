name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    name: Plan affected packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      filter: ${{ steps.plan.outputs.filter }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has-images: ${{ steps.plan.outputs.has-images }}
      has-packages: ${{ steps.plan.outputs.has-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select packages and images
        id: plan
        run: node scripts/ci/plan.mjs

  checks:
    name: Lint, types, unit tests and build
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Check CI tooling and root configuration
        run: |
          pnpm exec eslint .
          pnpm exec prettier --check .github scripts/ci CI.md
          node --test scripts/ci/plan.test.mjs
      - name: Check affected packages and their dependents
        env:
          TURBO_FILTER: ${{ needs.plan.outputs.filter }}
        run: pnpm exec turbo run lint typecheck test build --filter="$TURBO_FILTER"

  integration:
    name: PostgreSQL and Valkey integration
    needs: plan
    if: needs.plan.outputs.has-packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dirouter
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dirouter_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dirouter -d dirouter_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build integration test dependencies
        run: pnpm exec turbo run build --filter=@dirouter/shared --filter=@dirouter/worker^... --filter=@dirouter/control-api^...
      - name: Run integration tests against real services
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          VALKEY_CONTAINER: ${{ job.services.valkey.id }}
        run: node --test scripts/ci/services.integration.mjs
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://dirouter:ci-only-password@localhost:5432/dirouter_ci
        run: pnpm --filter @dirouter/db exec prisma migrate deploy
      - name: Usage pipeline against PostgreSQL and Valkey
        env:
          INTEGRATION_DATABASE_URL: postgresql://dirouter:ci-only-password@localhost:5432/dirouter_ci
          INTEGRATION_VALKEY_URL: redis://localhost:6379
        run: pnpm --filter @dirouter/worker run test:integration
      - name: Dashboard auth against PostgreSQL and Valkey
        env:
          INTEGRATION_DATABASE_URL: postgresql://dirouter:ci-only-password@localhost:5432/dirouter_ci
          INTEGRATION_VALKEY_URL: redis://localhost:6379
        run: pnpm --filter @dirouter/control-api run test:integration

  images:
    name: Image (${{ matrix.app }})
    needs: [plan, checks, integration]
    if: >-
      !cancelled() && needs.plan.outputs.has-images == 'true' &&
      needs.checks.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/${APP}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (publish only on trusted pushes)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
            PORT=${{ matrix.port }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  ci:
    name: CI passed
    needs: [plan, checks, integration, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all applicable jobs to pass
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          IMAGES: ${{ needs.images.result }}
          HAS_PACKAGES: ${{ needs.plan.outputs.has-packages }}
          HAS_IMAGES: ${{ needs.plan.outputs.has-images }}
        run: |
          test "$PLAN" = success
          test "$CHECKS" = success
          if [ "$HAS_PACKAGES" = true ]; then
            test "$INTEGRATION" = success
          else
            test "$INTEGRATION" = skipped
          fi
          if [ "$HAS_IMAGES" = true ]; then
            test "$IMAGES" = success
          else
            test "$IMAGES" = skipped
          fi
