name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    name: Plan affected packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      filter: ${{ steps.plan.outputs.filter }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has-images: ${{ steps.plan.outputs.has-images }}
      has-packages: ${{ steps.plan.outputs.has-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select packages and images
        id: plan
        run: node scripts/ci/plan.mjs

  checks:
    name: Lint, types, unit tests and build
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Check CI tooling and root configuration
        run: |
          pnpm exec eslint .
          pnpm exec prettier --check .github scripts/ci CI.md
          node --test scripts/ci/plan.test.mjs
          node --test scripts/ci/env-docs.test.mjs
          node scripts/ci/check-env-docs.mjs
      - name: Check affected packages and their dependents
        env:
          TURBO_FILTER: ${{ needs.plan.outputs.filter }}
        run: pnpm exec turbo run lint typecheck test build --filter="$TURBO_FILTER"
      - name: Publish Vitest coverage reports
        if: success()
        uses: actions/upload-artifact@bbb2c9d7abaf7d40940928533c730489d73f9e8c # v7.0.0
        with:
          name: vitest-coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize coverage
        if: success()
        run: node scripts/ci/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: PostgreSQL and Valkey integration
    needs: plan
    if: needs.plan.outputs.has-packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install isolated Testcontainers runner
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/integration
      - name: Start disposable PostgreSQL and Valkey containers
        run: pnpm test:integration
      - name: Publish integration coverage reports
        if: always()
        uses: actions/upload-artifact@bbb2c9d7abaf7d40940928533c730489d73f9e8c # v7.0.0
        with:
          name: integration-coverage
          path: |
            apps/control-api/coverage/
            apps/gateway/coverage/
            apps/worker/coverage/
          if-no-files-found: error
          retention-days: 14

  images:
    name: Image (${{ matrix.app }})
    needs: [plan, checks, integration]
    if: >-
      !cancelled() && needs.plan.outputs.has-images == 'true' &&
      needs.checks.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/${APP}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (publish only on trusted pushes)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
            ${{ matrix.port != '' && format('PORT={0}', matrix.port) || '' }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  ci:
    name: CI passed
    needs: [plan, checks, integration, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all applicable jobs to pass
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          IMAGES: ${{ needs.images.result }}
          HAS_PACKAGES: ${{ needs.plan.outputs.has-packages }}
          HAS_IMAGES: ${{ needs.plan.outputs.has-images }}
        run: |
          test "$PLAN" = success
          test "$CHECKS" = success
          if [ "$HAS_PACKAGES" = true ]; then
            test "$INTEGRATION" = success
          else
            test "$INTEGRATION" = skipped
          fi
          if [ "$HAS_IMAGES" = true ]; then
            test "$IMAGES" = success
          else
            test "$IMAGES" = skipped
          fi
