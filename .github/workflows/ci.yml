name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  # Supply-chain tools (card 22.3) run from their official images, pinned by digest.
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  SYFT_IMAGE: anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
  COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d

jobs:
  plan:
    name: Plan affected packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      filter: ${{ steps.plan.outputs.filter }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has-images: ${{ steps.plan.outputs.has-images }}
      has-packages: ${{ steps.plan.outputs.has-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select packages and images
        id: plan
        run: node scripts/ci/plan.mjs

  checks:
    name: Lint, types, unit tests and build
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Check CI tooling and root configuration
        run: |
          pnpm exec eslint .
          pnpm exec prettier --check .github scripts/ci CI.md
          node --test scripts/ci/plan.test.mjs
          node --test scripts/ci/env-docs.test.mjs
          node --test scripts/mcp/stdio-bridge.test.mjs
          node scripts/ci/check-env-docs.mjs
      - name: Check affected packages and their dependents
        env:
          TURBO_FILTER: ${{ needs.plan.outputs.filter }}
        run: pnpm exec turbo run lint typecheck test build --filter="$TURBO_FILTER"
      - name: Detect Vitest coverage reports
        id: coverage
        run: |
          if [ -n "$(find apps packages -path '*/coverage/*' -type f -print -quit 2>/dev/null)" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo 'No Vitest coverage reports were generated for this change.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish Vitest coverage reports
        if: success() && steps.coverage.outputs.found == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vitest-coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize coverage
        if: success() && steps.coverage.outputs.found == 'true'
        run: node scripts/ci/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: PostgreSQL and Valkey integration
    needs: plan
    if: needs.plan.outputs.has-packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install isolated Testcontainers runner
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/integration
      - name: Start disposable PostgreSQL and Valkey containers
        run: pnpm test:integration
      - name: Publish integration coverage reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: integration-coverage
          path: |
            apps/control-api/coverage/
            apps/gateway/coverage/
            apps/worker/coverage/
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Supply chain (dependencies and secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The gate works (a known Critical vulnerability is reported)
        # Exit code 3 means "vulnerabilities found"; anything else (a download error, say) fails.
        run: |
          status=0
          docker run --rm -v trivy-cache:/root/.cache \
            -v "$PWD/scripts/ci/fixtures/trivy-canary:/src:ro" "$TRIVY_IMAGE" \
            fs --scanners vuln --severity CRITICAL --exit-code 3 /src || status=$?
          test "$status" = 3
      - name: Dependencies and secrets (fails on Critical)
        run: |
          docker run --rm -v trivy-cache:/root/.cache -v "$PWD:/src:ro" "$TRIVY_IMAGE" \
            fs --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /src/scripts/ci/fixtures --skip-dirs /src/node_modules /src

  images:
    name: Image (${{ matrix.app }})
    needs: [plan, checks, integration]
    if: >-
      !cancelled() && needs.plan.outputs.has-images == 'true' &&
      needs.checks.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing with the workflow's OIDC identity (card 22.3).
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/${APP}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
            ${{ matrix.port != '' && format('PORT={0}', matrix.port) || '' }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan the image (fails on Critical)
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - name: SBOM (SPDX)
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            "$SYFT_IMAGE" "docker:$IMAGE" -o "spdx-json=/out/${{ matrix.app }}.spdx.json"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-${{ matrix.app }}
          path: sbom/${{ matrix.app }}.spdx.json
          retention-days: 90
      - name: Publish image (trusted pushes only)
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
            ${{ matrix.port != '' && format('PORT={0}', matrix.port) || '' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Sign the image and attach the SBOM (keyless, Sigstore)
        if: github.event_name == 'push'
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@
        run: |
          cosign() {
            docker run --rm -e COSIGN_YES=true \
              -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" -v "$PWD/sbom:/sbom:ro" \
              "$COSIGN_IMAGE" "$@"
          }
          cosign sign "$REF"
          cosign attest --type spdxjson --predicate "/sbom/${{ matrix.app }}.spdx.json" "$REF"
          cosign verify --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" > /dev/null
          echo "Signed and verified $REF" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI passed
    needs: [plan, checks, integration, images, supply-chain]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all applicable jobs to pass
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          IMAGES: ${{ needs.images.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          HAS_PACKAGES: ${{ needs.plan.outputs.has-packages }}
          HAS_IMAGES: ${{ needs.plan.outputs.has-images }}
        run: |
          test "$PLAN" = success
          test "$CHECKS" = success
          test "$SUPPLY_CHAIN" = success
          if [ "$HAS_PACKAGES" = true ]; then
            test "$INTEGRATION" = success
          else
            test "$INTEGRATION" = skipped
          fi
          if [ "$HAS_IMAGES" = true ]; then
            test "$IMAGES" = success
          else
            test "$IMAGES" = skipped
          fi
