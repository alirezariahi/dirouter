name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  # Supply-chain tools (card 22.3) run from their official images, pinned by digest.
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  SYFT_IMAGE: anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
  COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d

jobs:
  plan:
    name: Plan affected packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      filter: ${{ steps.plan.outputs.filter }}
      matrix: ${{ steps.plan.outputs.matrix }}
      image-matrix: ${{ steps.plan.outputs.image-matrix }}
      has-images: ${{ steps.plan.outputs.has-images }}
      has-packages: ${{ steps.plan.outputs.has-packages }}
      has-helm: ${{ steps.plan.outputs.has-helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select packages and images
        id: plan
        run: node scripts/ci/plan.mjs

  checks:
    name: Lint, types, unit tests and build
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Check CI tooling and root configuration
        run: |
          pnpm exec eslint .
          pnpm exec prettier --check .github scripts/ci CI.md
          node --test scripts/ci/plan.test.mjs
          node --test scripts/ci/env-docs.test.mjs
          node --test scripts/mcp/stdio-bridge.test.mjs
          node scripts/ci/check-env-docs.mjs
      - name: Check affected packages and their dependents
        env:
          TURBO_FILTER: ${{ needs.plan.outputs.filter }}
        # TURBO_FILTER holds one or more filters separated by spaces (see scripts/ci/plan.mjs).
        run: |
          # read -a splits on spaces without glob expansion (a full run's filter is `*`).
          read -r -a list <<< "$TURBO_FILTER"
          filters=()
          for filter in "${list[@]}"; do filters+=("--filter=$filter"); done
          pnpm exec turbo run lint typecheck test build "${filters[@]}"
      - name: Detect Vitest coverage reports
        id: coverage
        run: |
          if [ -n "$(find apps packages -path '*/coverage/*' -type f -print -quit 2>/dev/null)" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo 'No Vitest coverage reports were generated for this change.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish Vitest coverage reports
        if: success() && steps.coverage.outputs.found == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vitest-coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize coverage
        if: success() && steps.coverage.outputs.found == 'true'
        run: node scripts/ci/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: PostgreSQL and Valkey integration
    needs: plan
    if: needs.plan.outputs.has-packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The MVP upgrade test (card 22.7) reads the MVP's migrations from git history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install isolated Testcontainers runner
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/integration
      - name: Start disposable PostgreSQL and Valkey containers
        run: pnpm test:integration
      - name: Publish integration coverage reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: integration-coverage
          path: |
            apps/control-api/coverage/
            apps/gateway/coverage/
            apps/worker/coverage/
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Supply chain (dependencies and secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The gate works (a known Critical vulnerability is reported)
        # Exit code 3 means "vulnerabilities found"; anything else (a download error, say) fails.
        run: |
          status=0
          docker run --rm -v trivy-cache:/root/.cache \
            -v "$PWD/scripts/ci/fixtures/trivy-canary:/src:ro" "$TRIVY_IMAGE" \
            fs --scanners vuln --severity CRITICAL --exit-code 3 /src || status=$?
          test "$status" = 3
      - name: Dependencies and secrets (fails on Critical)
        run: |
          docker run --rm -v trivy-cache:/root/.cache -v "$PWD:/src:ro" "$TRIVY_IMAGE" \
            fs --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /src/scripts/ci/fixtures --skip-dirs /src/node_modules /src

  images:
    name: Image (${{ matrix.app }}, ${{ matrix.arch }})
    needs: [plan, checks, integration]
    if: >-
      !cancelled() && needs.plan.outputs.has-images == 'true' &&
      needs.checks.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    # Each architecture builds natively (card 29.1): emulated arm64 builds of the Node apps are slow.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing with the workflow's OIDC identity (card 22.3).
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.image-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/${APP}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: type=sha,format=long
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
            ${{ matrix.port != '' && format('PORT={0}', matrix.port) || '' }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}
      - name: Check the image architecture
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "$ARCH"
      - name: Scan the image (fails on Critical)
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          report=$(mktemp)
          if ! docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE" > "$report" 2>&1; then
            cat "$report"
            # Job logs need a GitHub sign-in; the summary of a public run does not.
            { echo "### Critical vulnerabilities in ${{ matrix.app }} (${{ matrix.arch }})"; echo '```'; tail -n 60 "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: SBOM (SPDX)
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          SBOM: ${{ matrix.app }}-${{ matrix.arch }}.spdx.json
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            "$SYFT_IMAGE" "docker:$IMAGE" -o "spdx-json=/out/$SBOM"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-${{ matrix.app }}-${{ matrix.arch }}
          path: sbom/${{ matrix.app }}-${{ matrix.arch }}.spdx.json
          retention-days: 90
      - name: Publish the image by digest (trusted pushes only)
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
            ${{ matrix.port != '' && format('PORT={0}', matrix.port) || '' }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
      - name: Sign the image and attach the SBOM (keyless, Sigstore)
        if: github.event_name == 'push'
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          SBOM: ${{ matrix.app }}-${{ matrix.arch }}.spdx.json
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@
        run: |
          # The cosign image runs as a non-root user: registry credentials come in through
          # DOCKER_CONFIG and its cache goes to a writable HOME.
          cosign() {
            docker run --rm -e COSIGN_YES=true -e HOME=/tmp -e DOCKER_CONFIG=/docker \
              -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -v "$HOME/.docker:/docker:ro" -v "$PWD/sbom:/sbom:ro" \
              "$COSIGN_IMAGE" "$@"
          }
          log=$(mktemp)
          if ! {
            cosign sign "$REF" &&
              cosign attest --type spdxjson --predicate "/sbom/$SBOM" "$REF" &&
              cosign verify --certificate-identity-regexp "$IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" > /dev/null
          } > "$log" 2>&1; then
            cat "$log"
            # Job logs need a GitHub sign-in; the summary of a public run does not.
            { echo '### Signing failed'; echo '```'; tail -n 30 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Signed, attested and verified $REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Record the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: github.event_name == 'push'
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Manifest (${{ matrix.app }})
    needs: [plan, images]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.plan.outputs.has-images == 'true' &&
      needs.images.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/${APP}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.app }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join both architectures into one manifest
        id: manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          refs=()
          for digest in digests/*; do refs+=("$IMAGE@sha256:$(basename "$digest")"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          first=$(head -n1 <<< "$TAGS")
          platforms=$(docker buildx imagetools inspect --raw "$first" |
            jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')
          echo "$first: $platforms" >> "$GITHUB_STEP_SUMMARY"
          test "$platforms" = "amd64,arm64"
          echo "digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$first" | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - name: Sign the manifest list (keyless, Sigstore)
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.manifest.outputs.digest }}
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@
        run: |
          cosign() {
            docker run --rm -e COSIGN_YES=true -e HOME=/tmp -e DOCKER_CONFIG=/docker \
              -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -v "$HOME/.docker:/docker:ro" "$COSIGN_IMAGE" "$@"
          }
          cosign sign "$REF"
          cosign verify --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" > /dev/null
          echo "Signed and verified $REF" >> "$GITHUB_STEP_SUMMARY"

  helm:
    name: Helm chart on kind
    needs: [plan]
    if: needs.plan.outputs.has-helm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: Lint and render (with the Traefik CRDs)
        run: |
          helm lint deploy/helm/dirouter --strict \
            --set database.url=postgresql://u:p@db:5432/d --set valkeyUrl=redis://valkey:6379
          helm template t deploy/helm/dirouter --set postgresql.enabled=true --set valkey.enabled=true \
            --api-versions traefik.io/v1alpha1/IngressRoute > rendered.yaml
          grep -q 'kind: IngressRoute' rendered.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: dirouter
      - name: Build gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/node.Dockerfile
          build-args: |
            APP=gateway
            PORT=8080
          load: true
          tags: dirouter-ci/gateway:ci
          cache-from: type=gha,scope=gateway
      - name: Build control-api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/node.Dockerfile
          build-args: |
            APP=control-api
            PORT=3000
          load: true
          tags: dirouter-ci/control-api:ci
          cache-from: type=gha,scope=control-api
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/node.Dockerfile
          build-args: |
            APP=worker
            PORT=3100
          load: true
          tags: dirouter-ci/worker:ci
          cache-from: type=gha,scope=worker
      - name: Build migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/migrate.Dockerfile
          build-args: APP=migrate
          load: true
          tags: dirouter-ci/migrate:ci
          cache-from: type=gha,scope=migrate
      - name: Install the chart and check it is healthy
        run: |
          for app in gateway control-api worker migrate; do kind load docker-image "dirouter-ci/$app:ci" --name dirouter; done
          values=(--set image.registry=dirouter-ci --set image.tag=ci --set image.pullPolicy=Never
            --set postgresql.enabled=true --set valkey.enabled=true
            --set dashboard.enabled=false --set portal.enabled=false
            --set gateway.autoscaling.enabled=false --set gateway.replicas=1 --set controlApi.replicas=1
            --set gateway.pdb.minAvailable=0 --set controlApi.pdb.minAvailable=0)
          helm install dirouter deploy/helm/dirouter "${values[@]}" --wait --timeout 12m
          kubectl get pods
          kubectl port-forward svc/dirouter-gateway 18080:8080 > /dev/null &
          kubectl port-forward svc/dirouter-control-api 13000:3000 > /dev/null &
          sleep 3
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:13000/readyz
          # An upgrade keeps the generated keys (stored credentials depend on MASTER_KEY).
          before=$(kubectl get secret dirouter-secrets -o jsonpath='{.data.MASTER_KEY}')
          helm upgrade dirouter deploy/helm/dirouter "${values[@]}" --wait --timeout 8m
          after=$(kubectl get secret dirouter-secrets -o jsonpath='{.data.MASTER_KEY}')
          test -n "$before" && test "$before" = "$after"
          echo "helm install and upgrade on kind: healthy, keys kept" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics
        if: failure()
        run: |
          {
            echo '### Helm on kind failed'
            echo '```'
            kubectl get pods -o wide 2>&1
            kubectl get events --sort-by=.lastTimestamp 2>&1 | tail -n 30
            for pod in $(kubectl get pods -o name 2>/dev/null); do
              echo "--- $pod"
              kubectl logs "$pod" --all-containers --tail=25 2>&1
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI passed
    needs: [plan, checks, integration, images, manifests, supply-chain, helm]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all applicable jobs to pass
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          IMAGES: ${{ needs.images.result }}
          MANIFESTS: ${{ needs.manifests.result }}
          EVENT: ${{ github.event_name }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          HELM: ${{ needs.helm.result }}
          HAS_HELM: ${{ needs.plan.outputs.has-helm }}
          HAS_PACKAGES: ${{ needs.plan.outputs.has-packages }}
          HAS_IMAGES: ${{ needs.plan.outputs.has-images }}
        run: |
          test "$PLAN" = success
          test "$CHECKS" = success
          test "$SUPPLY_CHAIN" = success
          if [ "$HAS_PACKAGES" = true ]; then
            test "$INTEGRATION" = success
          else
            test "$INTEGRATION" = skipped
          fi
          if [ "$HAS_HELM" = true ]; then
            test "$HELM" = success
          else
            test "$HELM" = skipped
          fi
          if [ "$HAS_IMAGES" = true ]; then
            test "$IMAGES" = success
          else
            test "$IMAGES" = skipped
          fi
          if [ "$HAS_IMAGES" = true ] && [ "$EVENT" = push ]; then
            test "$MANIFESTS" = success
          else
            test "$MANIFESTS" = skipped
          fi
