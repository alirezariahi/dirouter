groups:
  - name: dirouter.availability
    interval: 30s
    rules:
      - alert: DiRouterTargetDown
        expr: up{job=~"dirouter-gateway|dirouter-control-api|dirouter-worker|traefik"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Metrics for {{ $labels.job }} are unavailable'
          description: 'Prometheus has been unable to scrape {{ $labels.instance }} for at least two minutes.'

      - alert: DiRouterQueueMetricsUnavailable
        expr: dirouter_queue_metrics_up == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Reading queue lengths from Valkey is failing'
          description: 'Queue metric collection in {{ $labels.job }} is failing; queue values may be stale.'

  - name: dirouter.gateway
    interval: 30s
    rules:
      - alert: DiRouterGatewayHighErrorRatio
        expr: |
          sum by (job, instance) (rate(dirouter_gateway_requests_total{status="error"}[5m]))
            / clamp_min(sum by (job, instance) (rate(dirouter_gateway_requests_total[5m])), 0.01)
            > 0.10
            and sum by (job, instance) (rate(dirouter_gateway_requests_total[5m])) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'Gateway error rate is above 10%'
          description: 'The error ratio on {{ $labels.instance }} over the last five minutes is {{ $value | printf "%.2f" }}.'

      - alert: DiRouterGatewayHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (job, instance, le) (rate(dirouter_gateway_request_duration_seconds_bucket[10m])))
            > 30
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'p95 latency of LLM requests is above 30 seconds'
          description: 'p95 on {{ $labels.instance }} is {{ $value | printf "%.1f" }} seconds.'

      - alert: DiRouterGatewayUsageOutboxGrowing
        expr: |
          dirouter_gateway_usage_outbox_events > 1000
            and deriv(dirouter_gateway_usage_outbox_events[15m]) > 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'Gateway usage outbox is growing'
          description: '{{ $value | printf "%.0f" }} events are pending on {{ $labels.instance }}; check the worker and Valkey connection.'

      - alert: DiRouterGatewayCircuitBreakerOpen
        expr: dirouter_gateway_breaker_state{state=~"open|half_open"} == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Circuit breaker is open'
          description: 'Breaker for {{ $labels.scope }}/{{ $labels.provider }}/{{ $labels.model }} is in state {{ $labels.state }}.'

  - name: dirouter.pipeline
    interval: 30s
    rules:
      - alert: DiRouterQueueBacklog
        expr: sum by (job, instance, queue) (dirouter_queue_jobs{state=~"waiting|delayed|active"}) > 1000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Queue {{ $labels.queue }} backlog is high'
          description: 'Queue {{ $labels.queue }} on {{ $labels.instance }} has {{ $value | printf "%.0f" }} waiting/active jobs.'

      - alert: DiRouterUsageDeadLetter
        expr: increase(dirouter_usage_events_dead_total[10m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Usage events went to the dead-letter queue'
          description: '{{ $value | printf "%.0f" }} events were dead-lettered in the last ten minutes; check the worker logs.'

      - alert: DiRouterWorkerJobFailures
        expr: |
          sum by (job, instance) (rate(dirouter_worker_job_duration_seconds_count{outcome="error"}[10m]))
            / clamp_min(sum by (job, instance) (rate(dirouter_worker_job_duration_seconds_count[10m])), 0.001)
            > 0.10
            and sum by (job, instance) (rate(dirouter_worker_job_duration_seconds_count[10m])) > 0.01
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Worker job failure rate is above 10%'
          description: 'The job failure ratio on {{ $labels.instance }} is {{ $value | printf "%.2f" }}.'
