global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: dirouter

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: dirouter-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']
        labels: { service: gateway }

  - job_name: dirouter-control-api
    metrics_path: /metrics
    static_configs:
      - targets: ['control-api:3000']
        labels: { service: control-api }

  - job_name: dirouter-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:3100']
        labels: { service: worker }

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      # In Traefik the metrics are on the internal traefik entryPoint (=8082), not the gateway.
      - targets: ['traefik:8082']
        labels: { service: traefik }
