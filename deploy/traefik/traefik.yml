# Static Traefik configuration for production (TLS with Let's Encrypt).
# __ACME_EMAIL__ is replaced from env when the container runs (compose.prod.yaml).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  # ping and metrics; not published.
  traefik:
    address: ':8082'
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls:
        certResolver: le
    # SSE: writing the response must not time out; reading the request body takes at most 5 minutes.
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 0s
        idleTimeout: 180s
      lifeCycle:
        requestAcceptGraceTimeout: 5s
        graceTimeOut: 60s

ping:
  entryPoint: traefik

api:
  dashboard: true

providers:
  docker:
    exposedByDefault: false
    network: dirouter_edge
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  le:
    acme:
      email: __ACME_EMAIL__
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
      # DNS-01 (optional, for wildcard): remove httpChallenge and enable this
      # and pass the provider variables (e.g. CF_DNS_API_TOKEN) to the container.
      # dnsChallenge:
      #   provider: cloudflare

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        X-Request-Id: keep

metrics:
  prometheus:
    entryPoint: traefik
    addRoutersLabels: true
    addServicesLabels: true
