# Static Traefik configuration for development: *.localhost with the default self-signed certificate
# Traefik on HTTPS, and no redirect to HTTP (for plain curl).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  # ping and metrics; not published.
  traefik:
    address: ':8082'
  web:
    address: ':80'
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 0s
        idleTimeout: 180s
  websecure:
    address: ':443'
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 0s
        idleTimeout: 180s

ping:
  entryPoint: traefik

api:
  dashboard: true

providers:
  docker:
    exposedByDefault: false
    network: dirouter_edge
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json

metrics:
  prometheus:
    entryPoint: traefik
    addRoutersLabels: true
    addServicesLabels: true
