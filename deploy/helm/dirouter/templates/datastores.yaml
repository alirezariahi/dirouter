{{- $full := include "dirouter.fullname" . }}
{{- if .Values.postgresql.enabled }}
# Single-instance PostgreSQL for evaluation; use a managed, replicated database in production.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-postgres
  labels: {{- include "dirouter.labels" . | nindent 4 }}
spec:
  serviceName: {{ $full }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "dirouter.selector" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dirouter.selector" (dict "ctx" $ "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "dirouter.secretName" . }}, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-postgres
  labels: {{- include "dirouter.labels" . | nindent 4 }}
spec:
  selector: {{- include "dirouter.selector" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
{{- end }}
{{- if .Values.valkey.enabled }}
# Single-instance Valkey for evaluation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-valkey
  labels: {{- include "dirouter.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "dirouter.selector" (dict "ctx" $ "component" "valkey") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dirouter.selector" (dict "ctx" $ "component" "valkey") | nindent 8 }}
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          ports: [{ name: valkey, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [valkey-cli, ping] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-valkey
  labels: {{- include "dirouter.labels" . | nindent 4 }}
spec:
  selector: {{- include "dirouter.selector" (dict "ctx" $ "component" "valkey") | nindent 4 }}
  ports: [{ name: valkey, port: 6379, targetPort: valkey }]
{{- end }}
