{{- if not .Values.secrets.existingSecret }}
{{- $name := include "dirouter.secretName" . }}
{{- /* Reuse what an earlier install generated: keys must never change on upgrade. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $keep := dict }}
{{- range $k, $v := $old }}{{- $_ := set $keep $k ($v | b64dec) }}{{- end }}
{{- $pgPassword := .Values.postgresql.password | default ($keep.POSTGRES_PASSWORD | default (randAlphaNum 24)) }}
{{- $databaseUrl := .Values.database.url }}
{{- if .Values.postgresql.enabled }}
{{- $databaseUrl = printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgresql.user $pgPassword (include "dirouter.fullname" .) .Values.postgresql.database }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "dirouter.labels" . | nindent 4 }}
  annotations:
    # Keep the generated keys if the release is uninstalled by mistake.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MASTER_KEY: {{ .Values.secrets.masterKey | default ($keep.MASTER_KEY | default (randAlphaNum 32 | b64enc)) | quote }}
  KEY_PEPPER: {{ .Values.secrets.keyPepper | default ($keep.KEY_PEPPER | default (randAlphaNum 48)) | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default ($keep.JWT_SECRET | default (randAlphaNum 48)) | quote }}
  INTERNAL_TOKEN: {{ .Values.secrets.internalToken | default ($keep.INTERNAL_TOKEN | default (randAlphaNum 48)) | quote }}
  DATABASE_URL: {{ required "database.url is required (or enable postgresql)" $databaseUrl | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
{{- end }}
