{{- $full := include "dirouter.fullname" . }}
{{- $v := .Values.controlApi }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-control-api
  labels: {{- include "dirouter.labels" . | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels: {{- include "dirouter.selector" (dict "ctx" $ "component" "control-api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dirouter.selector" (dict "ctx" $ "component" "control-api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "dirouter.pod" . | nindent 6 }}
      # Migrations run before the API starts; Prisma's advisory lock keeps concurrent replicas safe.
      initContainers:
        - name: migrate
          image: {{ include "dirouter.image" (dict "ctx" $ "app" "migrate") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "dirouter.containerSecurity" . | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "dirouter.secretName" . }}, key: DATABASE_URL } }
      containers:
        - name: control-api
          image: {{ include "dirouter.image" (dict "ctx" $ "app" "control-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "dirouter.containerSecurity" . | nindent 12 }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            {{- include "dirouter.secretEnv" (dict "ctx" . "names" (list "MASTER_KEY" "KEY_PEPPER" "JWT_SECRET" "INTERNAL_TOKEN" "DATABASE_URL")) | nindent 12 }}
            - { name: PORT, value: '3000' }
            - { name: VALKEY_URL, value: {{ include "dirouter.valkeyUrl" . | quote }} }
            - { name: GATEWAY_INTERNAL_URL, value: 'http://{{ $full }}-gateway:8080' }
            - { name: DASHBOARD_ORIGIN, value: 'https://{{ include "dirouter.host" (dict "ctx" $ "name" "app") }}' }
            - { name: PUBLIC_DASHBOARD_URL, value: 'https://{{ include "dirouter.host" (dict "ctx" $ "name" "app") }}' }
            - { name: PUBLIC_API_URL, value: 'https://{{ include "dirouter.host" (dict "ctx" $ "name" "admin") }}' }
            - { name: PUBLIC_GATEWAY_URL, value: 'https://{{ include "dirouter.host" (dict "ctx" $ "name" "api") }}' }
            - { name: PUBLIC_PORTAL_URL, value: 'https://{{ include "dirouter.host" (dict "ctx" $ "name" "portal") }}' }
            - { name: TRUST_PROXY, value: {{ $v.trustProxy | default "1" | quote }} }
            {{- range $name, $value := $v.extraEnv }}
            - { name: {{ $name }}, value: {{ $value | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml $v.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-control-api
  labels: {{- include "dirouter.labels" . | nindent 4 }}
spec:
  selector: {{- include "dirouter.selector" (dict "ctx" $ "component" "control-api") | nindent 4 }}
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-control-api
  labels: {{- include "dirouter.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $v.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "dirouter.selector" (dict "ctx" $ "component" "control-api") | nindent 6 }}
