# Development environment: hot-reload with bind mounts, database ports on localhost only,
# mailpit and mock-provider. Run: make up

x-dev-node:
  &dev-node # Only dev-deps builds the image; the rest reuse it (a parallel build of one tag would conflict).
  image: dirouter/dev:local
  pull_policy: never
  restart: unless-stopped
  working_dir: /repo
  volumes:
    - .:/repo
    # node_modules inside the container (Linux) is separate from the host's node_modules (macOS).
    - nm-root:/repo/node_modules
    - nm-gateway:/repo/apps/gateway/node_modules
    - nm-control-api:/repo/apps/control-api/node_modules
    - nm-worker:/repo/apps/worker/node_modules
    - nm-dashboard:/repo/apps/dashboard/node_modules
    - nm-mock-provider:/repo/apps/mock-provider/node_modules
    - nm-contracts:/repo/packages/contracts/node_modules
    - nm-shared:/repo/packages/shared/node_modules
    - nm-db:/repo/packages/db/node_modules
    - nm-model-catalog:/repo/packages/model-catalog/node_modules
    - nm-ui:/repo/packages/ui/node_modules
    - nm-eslint-config:/repo/packages/eslint-config/node_modules
    - nm-tsconfig:/repo/packages/tsconfig/node_modules
    - pnpm-store:/pnpm/store
    - gateway-data:/data
  depends_on: !override
    dev-deps: { condition: service_healthy }

volumes:
  nm-root:
  nm-gateway:
  nm-control-api:
  nm-worker:
  nm-dashboard:
  nm-mock-provider:
  nm-contracts:
  nm-shared:
  nm-db:
  nm-model-catalog:
  nm-ui:
  nm-eslint-config:
  nm-tsconfig:
  pnpm-store:

services:
  traefik:
    volumes:
      - ./deploy/traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro

  postgres:
    # In dev it is also on edge so the published port works (the internal network does not publish ports).
    networks: [internal, edge]
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'

  valkey:
    networks: [internal, edge]
    ports:
      - '127.0.0.1:${VALKEY_PORT:-56379}:6379'

  # In dev, migration is run by dev-deps.
  migrate:
    profiles: [never]

  # Install dependencies, run prisma generate and migrate, and tsc watch for all packages.
  dev-deps:
    <<: *dev-node
    build:
      context: .
      dockerfile: deploy/docker/dev.Dockerfile
    pull_policy: build
    depends_on: !override
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
    networks: [internal, edge]
    # watch only (one initial emit), and healthy once all packages have emitted; apps
    # start after that so the initial emit does not cause back-to-back restarts.
    command:
      - sh
      - -c
      - >-
        pnpm install --frozen-lockfile &&
        pnpm --filter @dirouter/db exec prisma migrate deploy &&
        pnpm --filter @dirouter/db exec prisma generate &&
        rm -rf packages/*/dist /tmp/watching &&
        touch /tmp/watching &&
        pnpm -r --parallel --filter './packages/*' run dev
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/watching && for p in contracts shared db model-catalog ui translator providers routing; do test -f packages/$$p/dist/index.js || exit 1; done
      interval: 5s
      timeout: 2s
      retries: 120
      start_period: 300s

  control-api:
    <<: *dev-node
    build: !reset null
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
      VALKEY_URL: redis://valkey:6379
      MASTER_KEY: ${MASTER_KEY}
      KEY_PEPPER: ${KEY_PEPPER}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # In dev the dashboard is reachable over both http and https (self-signed certificate).
      DASHBOARD_ORIGIN: https://app.${DOMAIN:-localhost},http://app.${DOMAIN:-localhost}
      PUBLIC_DASHBOARD_URL: https://app.${DOMAIN:-localhost}
      GATEWAY_INTERNAL_URL: http://gateway:8080
      SMTP_URL: smtp://mailpit:1025
    command: ['pnpm', '--filter', '@dirouter/control-api', 'dev']
    labels:
      # In dev the router takes HTTPS only; a separate router handles plain HTTP.
      traefik.http.routers.control-api-http.rule: Host(`admin.${DOMAIN:-localhost}`)
      traefik.http.routers.control-api-http.entrypoints: web
      traefik.http.routers.control-api-http.service: control-api
      traefik.http.routers.control-api-http.middlewares: security-headers@file,control-api-cors@file
    depends_on: !override
      dev-deps: { condition: service_healthy }
      valkey: { condition: service_healthy }

  gateway:
    <<: *dev-node
    build: !reset null
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PORT: '8080'
      VALKEY_URL: redis://valkey:6379
      MASTER_KEY: ${MASTER_KEY}
      KEY_PEPPER: ${KEY_PEPPER}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CONTROL_API_URL: http://control-api:3000
      DATA_DIR: /repo/.data/gateway
    command: ['pnpm', '--filter', '@dirouter/gateway', 'dev']
    labels:
      traefik.http.routers.gateway-http.rule: Host(`api.${DOMAIN:-localhost}`)
      traefik.http.routers.gateway-http.entrypoints: web
      traefik.http.routers.gateway-http.service: gateway
      traefik.http.routers.gateway-http.middlewares: security-headers@file
      traefik.http.services.gateway.loadbalancer.healthcheck.path: /healthz
    depends_on: !override
      dev-deps: { condition: service_healthy }
      valkey: { condition: service_healthy }

  worker:
    <<: *dev-node
    build: !reset null
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PORT: '3100'
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
      VALKEY_URL: redis://valkey:6379
    command: ['pnpm', '--filter', '@dirouter/worker', 'dev']
    depends_on: !override
      dev-deps: { condition: service_healthy }
      valkey: { condition: service_healthy }

  dashboard:
    <<: *dev-node
    build: !reset null
    # The API address is built from the page's own address (app. → admin.), so both http and https work.
    command:
      ['pnpm', '--filter', '@dirouter/dashboard', 'dev', '--host', '0.0.0.0', '--port', '8080']
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.dashboard.rule: Host(`app.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard-http.rule: Host(`app.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard-http.entrypoints: web
      traefik.http.routers.dashboard-http.service: dashboard
      traefik.http.routers.dashboard-http.middlewares: security-headers@file
      traefik.http.services.dashboard.loadbalancer.server.port: '8080'

  mock-provider:
    <<: *dev-node
    build: !reset null
    profiles: !reset []
    environment:
      NODE_ENV: development
      PORT: '8090'
    command: ['pnpm', '--filter', '@dirouter/mock-provider', 'dev']
    networks: [edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.mock.rule: Host(`mock.${DOMAIN:-localhost}`)
      traefik.http.routers.mock.entrypoints: web,websecure
      traefik.http.services.mock.loadbalancer.server.port: '8090'

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    networks: [edge]
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025'
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.mail.rule: Host(`mail.${DOMAIN:-localhost}`)
      traefik.http.routers.mail.entrypoints: web,websecure
      traefik.http.services.mail.loadbalancer.server.port: '8025'
