# Shared base for all environments. Always run together with one of the overrides:
#   dev:  docker compose -f compose.yaml -f compose.dev.yaml up
#   prod: docker compose -f compose.yaml -f compose.prod.yaml up -d
# (or via Makefile: make up / make prod-up)

name: dirouter

x-node-env: &node-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}

networks:
  # Traefik and apps
  edge:
  # Database and Valkey; no external access
  internal:
    internal: true

volumes:
  pgdata:
  valkeydata:
  gateway-data:
  traefik-acme:
  prometheus-data:
  grafana-data:

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      TRAEFIK_DASHBOARD_USERS: ${TRAEFIK_DASHBOARD_USERS:-}
      TRAEFIK_ALLOW_IPS: ${TRAEFIK_ALLOW_IPS:-127.0.0.1/32}
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    networks: [edge]
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dirouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dirouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - valkeydata:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Run migrations before control-api and worker start.
  migrate:
    image: ${REGISTRY:-dirouter}/migrate:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/migrate.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  control-api:
    image: ${REGISTRY:-dirouter}/control-api:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/node.Dockerfile
      args: { APP: control-api, PORT: '3000' }
    restart: unless-stopped
    environment:
      <<: *node-env
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
      VALKEY_URL: redis://valkey:6379
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      KEY_PEPPER: ${KEY_PEPPER:?KEY_PEPPER is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-https://app.${DOMAIN:-localhost}}
      PUBLIC_DASHBOARD_URL: ${DASHBOARD_ORIGIN:-https://app.${DOMAIN:-localhost}}
      GATEWAY_INTERNAL_URL: http://gateway:8080
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-DiRouter <noreply@${DOMAIN:-localhost}>}
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.control-api.rule: Host(`admin.${DOMAIN:-localhost}`)
      traefik.http.routers.control-api.entrypoints: websecure
      traefik.http.routers.control-api.tls: 'true'
      traefik.http.routers.control-api.middlewares: security-headers@file,control-api-cors@file,control-api-ratelimit@file,compress@file
      traefik.http.services.control-api.loadbalancer.server.port: '3000'
      traefik.http.services.control-api.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.control-api.loadbalancer.healthcheck.interval: 5s

  gateway:
    image: ${REGISTRY:-dirouter}/gateway:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/node.Dockerfile
      args: { APP: gateway, PORT: '8080' }
    restart: unless-stopped
    environment:
      <<: *node-env
      PORT: '8080'
      VALKEY_URL: redis://valkey:6379
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      KEY_PEPPER: ${KEY_PEPPER:?KEY_PEPPER is required}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
      CONTROL_API_URL: http://control-api:3000
      DATA_DIR: /data
      SHUTDOWN_DRAIN_MS: ${GATEWAY_SHUTDOWN_DRAIN_MS:-30000}
      # More than two Traefik health check rounds (2 seconds), so the replica leaves rotation before it closes.
      SHUTDOWN_READY_DELAY_MS: ${GATEWAY_SHUTDOWN_READY_DELAY_MS:-5000}
    # gateway has no access to Postgres (ADR-006): only Valkey, on the internal network.
    networks: [edge, internal]
    # ready delay (5s) + drain (30s) + consumer flush; must be longer than their sum, otherwise SIGKILL cuts the streams.
    stop_grace_period: 45s
    volumes:
      - gateway-data:/data
    depends_on:
      valkey: { condition: service_healthy }
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.gateway.rule: Host(`api.${DOMAIN:-localhost}`)
      traefik.http.routers.gateway.entrypoints: websecure
      traefik.http.routers.gateway.tls: 'true'
      # compress except text/event-stream, so SSE is not buffered.
      traefik.http.routers.gateway.middlewares: security-headers@file,compress@file
      traefik.http.services.gateway.loadbalancer.server.port: '8080'
      traefik.http.services.gateway.loadbalancer.serversTransport: long-stream@file
      traefik.http.services.gateway.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.gateway.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.gateway.loadbalancer.healthcheck.timeout: 1s

  worker:
    image: ${REGISTRY:-dirouter}/worker:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/node.Dockerfile
      args: { APP: worker, PORT: '3100' }
    restart: unless-stopped
    environment:
      <<: *node-env
      PORT: '3100'
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
      VALKEY_URL: redis://valkey:6379
      REQUEST_LOG_RETENTION_MONTHS: ${REQUEST_LOG_RETENTION_MONTHS:-3}
    networks: [internal]
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  dashboard:
    image: ${REGISTRY:-dirouter}/dashboard:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/dashboard.Dockerfile
    restart: unless-stopped
    environment:
      DIROUTER_API_URL: https://admin.${DOMAIN:-localhost}/api/v1
    networks: [edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.dashboard.rule: Host(`app.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: 'true'
      traefik.http.routers.dashboard.middlewares: security-headers@file,compress@file
      traefik.http.services.dashboard.loadbalancer.server.port: '8080'

  # Mock provider for e2e and load testing (mock profile; always running in dev).
  mock-provider:
    image: ${REGISTRY:-dirouter}/mock-provider:${TAG:-latest}
    profiles: [mock]
    build:
      context: .
      dockerfile: deploy/docker/node.Dockerfile
      args: { APP: mock-provider, PORT: '8090' }
    restart: unless-stopped
    environment:
      PORT: '8090'
    networks: [edge]

  # Optional monitoring; metrics are scraped only on internal networks.
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.7.3}
    profiles: [monitoring]
    restart: unless-stopped
    user: '65534:65534'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks: [edge, internal]
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-59090}:9090'
    depends_on:
      traefik: { condition: service_healthy }
      control-api: { condition: service_started }
      gateway: { condition: service_started }
      worker: { condition: service_started }
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.2.1}
    profiles: [monitoring]
    restart: unless-stopped
    user: '472:472'
    # The password is only needed by the optional `monitoring` profile. Using
    # `:?` here would force interpolation for every compose command (even
    # `docker compose ps`), so the value is interpolated leniently and the
    # missing-password case is rejected at container start instead.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_ADMIN_PASSWORD is required for the monitoring profile" >&2
          exit 1
        fi
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_SYNC: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-53000}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'false'
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [edge]
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-53000}:3000'
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
