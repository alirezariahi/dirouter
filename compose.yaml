# Shared base for all environments. Always run together with one of the overrides:
#   dev:  docker compose -f compose.yaml -f compose.dev.yaml up
#   prod: docker compose -f compose.yaml -f compose.prod.yaml up -d
# (or via Makefile: make up / make prod-up)

name: dirouter

x-node-env: &node-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}

networks:
  # Traefik and apps
  edge:
  # Database and Valkey; no external access
  internal:
    internal: true

volumes:
  pgdata:
  valkeydata:
  gateway-data:
  traefik-acme:
  prometheus-data:
  grafana-data:

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      TRAEFIK_DASHBOARD_USERS: ${TRAEFIK_DASHBOARD_USERS:-}
      TRAEFIK_ALLOW_IPS: ${TRAEFIK_ALLOW_IPS:-127.0.0.1/32}
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    networks: [edge]
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    # The semantic cache needs the pgvector extension: build deploy/docker/postgres.Dockerfile and
    # set POSTGRES_IMAGE=dirouter/postgres:17-pgvector (same base image, the data volume is reused).
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dirouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dirouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - valkeydata:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Run migrations before control-api and worker start.
  migrate:
    image: ${REGISTRY:-dirouter}/migrate:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/migrate.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  control-api:
    image: ${REGISTRY:-dirouter}/control-api:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/node.Dockerfile
      args: { APP: control-api, PORT: '3000' }
    restart: unless-stopped
    environment:
      <<: *node-env
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
      VALKEY_URL: redis://valkey:6379
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      KEY_PEPPER: ${KEY_PEPPER:?KEY_PEPPER is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-https://app.${DOMAIN:-localhost}}
      PUBLIC_DASHBOARD_URL: ${DASHBOARD_ORIGIN:-https://app.${DOMAIN:-localhost}}
      GATEWAY_INTERNAL_URL: http://gateway:8080
      # Proxies whose X-Forwarded-For is believed: one hop, the Traefik in front (docs/env-reference.md).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Semantic cache (card 13.2): off until an embeddings endpoint is configured.
      SEMANTIC_CACHE_EMBEDDING_URL: ${SEMANTIC_CACHE_EMBEDDING_URL:-}
      SEMANTIC_CACHE_EMBEDDING_KEY: ${SEMANTIC_CACHE_EMBEDDING_KEY:-}
      SEMANTIC_CACHE_EMBEDDING_MODEL: ${SEMANTIC_CACHE_EMBEDDING_MODEL:-text-embedding-3-small}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-DiRouter <noreply@${DOMAIN:-localhost}>}
      # Online top-ups (card 19.2): a provider is offered only when its credentials are set.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://admin.${DOMAIN:-localhost}}
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-https://api.${DOMAIN:-localhost}}
      # Provider plugins (card 21.2): none load unless named in PLUGINS_ENABLED.
      PLUGINS_DIR: /plugins
      PLUGINS_ENABLED: ${PLUGINS_ENABLED:-}
      # Self-service portal (card 19.5) and its optional OIDC sign-in (e.g. Google).
      PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL:-https://portal.${DOMAIN:-localhost}}
      PORTAL_OIDC_ISSUER: ${PORTAL_OIDC_ISSUER:-}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-}
      PORTAL_OIDC_NAME: ${PORTAL_OIDC_NAME:-}
      PAYMENT_RETURN_ORIGINS: ${PAYMENT_RETURN_ORIGINS:-}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_BASE_URL: ${ZARINPAL_BASE_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL:-}
    networks: [edge, internal]
    volumes:
      - ${PLUGINS_PATH:-./plugins}:/plugins:ro
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.control-api.rule: Host(`admin.${DOMAIN:-localhost}`)
      traefik.http.routers.control-api.entrypoints: websecure
      traefik.http.routers.control-api.tls: 'true'
      traefik.http.routers.control-api.middlewares: security-headers@file,control-api-cors@file,control-api-ratelimit@file,compress@file
      traefik.http.services.control-api.loadbalancer.server.port: '3000'
      traefik.http.services.control-api.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.control-api.loadbalancer.healthcheck.interval: 5s

  gateway:
    image: ${REGISTRY:-dirouter}/gateway:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/node.Dockerfile
      args: { APP: gateway, PORT: '8080' }
    restart: unless-stopped
    environment:
      <<: *node-env
      PORT: '8080'
      VALKEY_URL: redis://valkey:6379
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      KEY_PEPPER: ${KEY_PEPPER:?KEY_PEPPER is required}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
      CONTROL_API_URL: http://control-api:3000
      DATA_DIR: /data
      # Provider plugins (card 21.2): none load unless named in PLUGINS_ENABLED.
      PLUGINS_DIR: /plugins
      PLUGINS_ENABLED: ${PLUGINS_ENABLED:-}
      # Web search backends (card 30.8): SearXNG (self-hosted), Brave and Tavily; empty = unused.
      WEB_SEARCH_SEARXNG_URL: ${WEB_SEARCH_SEARXNG_URL:-}
      WEB_SEARCH_BRAVE_API_KEY: ${WEB_SEARCH_BRAVE_API_KEY:-}
      WEB_SEARCH_BRAVE_URL: ${WEB_SEARCH_BRAVE_URL:-}
      WEB_SEARCH_TAVILY_API_KEY: ${WEB_SEARCH_TAVILY_API_KEY:-}
      WEB_SEARCH_TAVILY_URL: ${WEB_SEARCH_TAVILY_URL:-}
      SHUTDOWN_DRAIN_MS: ${GATEWAY_SHUTDOWN_DRAIN_MS:-30000}
      # More than two Traefik health check rounds (2 seconds), so the replica leaves rotation before it closes.
      SHUTDOWN_READY_DELAY_MS: ${GATEWAY_SHUTDOWN_READY_DELAY_MS:-5000}
      # Files and batches (card 30.1): bytes on the /data volume unless FILES_STORAGE=s3.
      FILES_STORAGE: ${FILES_STORAGE:-local}
      FILES_DIR: ${FILES_DIR:-/data/files}
      FILES_MAX_BYTES: ${FILES_MAX_BYTES:-104857600}
      FILES_RETENTION_DAYS: ${FILES_RETENTION_DAYS:-30}
      FILES_S3_ENDPOINT: ${FILES_S3_ENDPOINT:-}
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:-}
      FILES_S3_REGION: ${FILES_S3_REGION:-us-east-1}
      FILES_S3_ACCESS_KEY_ID: ${FILES_S3_ACCESS_KEY_ID:-}
      FILES_S3_SECRET_ACCESS_KEY: ${FILES_S3_SECRET_ACCESS_KEY:-}
      FILES_S3_PREFIX: ${FILES_S3_PREFIX:-}
      FILES_S3_PATH_STYLE: ${FILES_S3_PATH_STYLE:-true}
      JOBS_POLL_INTERVAL_MS: ${JOBS_POLL_INTERVAL_MS:-15000}
      # Realtime WebSocket sessions (card 30.5): longest session and open sessions per replica.
      REALTIME_MAX_SESSION_SECONDS: ${REALTIME_MAX_SESSION_SECONDS:-1800}
      REALTIME_MAX_SESSIONS: ${REALTIME_MAX_SESSIONS:-1000}
    # gateway has no access to Postgres (ADR-006): only Valkey, on the internal network.
    networks: [edge, internal]
    # ready delay (5s) + drain (30s) + consumer flush; must be longer than their sum, otherwise SIGKILL cuts the streams.
    stop_grace_period: 45s
    volumes:
      - gateway-data:/data
      - ${PLUGINS_PATH:-./plugins}:/plugins:ro
    depends_on:
      valkey: { condition: service_healthy }
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.gateway.rule: Host(`api.${DOMAIN:-localhost}`)
      traefik.http.routers.gateway.entrypoints: websecure
      traefik.http.routers.gateway.tls: 'true'
      # compress except text/event-stream, so SSE is not buffered.
      traefik.http.routers.gateway.middlewares: security-headers@file,gateway-retry@file,compress@file
      # Realtime API over WebSocket (card 30.5): its own router, longer rule so it wins. Traefik
      # passes the upgrade through; no compression (it would buffer the 101 response) and no
      # retry (a session is never replayed).
      traefik.http.routers.gateway-realtime.rule: Host(`api.${DOMAIN:-localhost}`) && PathPrefix(`/v1/realtime`)
      traefik.http.routers.gateway-realtime.entrypoints: websecure
      traefik.http.routers.gateway-realtime.tls: 'true'
      traefik.http.routers.gateway-realtime.service: gateway
      traefik.http.routers.gateway-realtime.middlewares: security-headers@file
      traefik.http.services.gateway.loadbalancer.server.port: '8080'
      traefik.http.services.gateway.loadbalancer.serversTransport: long-stream@file
      traefik.http.services.gateway.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.gateway.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.gateway.loadbalancer.healthcheck.timeout: 1s

  worker:
    image: ${REGISTRY:-dirouter}/worker:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/node.Dockerfile
      args: { APP: worker, PORT: '3100' }
    restart: unless-stopped
    environment:
      <<: *node-env
      PORT: '3100'
      DATABASE_URL: postgresql://${POSTGRES_USER:-dirouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dirouter}
      VALKEY_URL: redis://valkey:6379
      REQUEST_LOG_RETENTION_MONTHS: ${REQUEST_LOG_RETENTION_MONTHS:-3}
      # Alert email channels (card 24.2) use the same SMTP settings as the control-api.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-DiRouter <noreply@${DOMAIN:-localhost}>}
      REQUEST_BODY_RETENTION_DAYS: ${REQUEST_BODY_RETENTION_DAYS:-7}
      # Catalog and price sync (card 27.5); the defaults are the worker's own. Air-gapped installs
      # set CATALOG_SYNC_ENABLED=false or point CATALOG_SYNC_SOURCES at an internal mirror.
      CATALOG_SYNC_ENABLED: ${CATALOG_SYNC_ENABLED:-true}
      CATALOG_SYNC_SOURCES: ${CATALOG_SYNC_SOURCES:-https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}
      CATALOG_SYNC_MODE: ${CATALOG_SYNC_MODE:-manual}
      CATALOG_SYNC_INTERVAL_MS: ${CATALOG_SYNC_INTERVAL_MS:-21600000}
      CATALOG_SYNC_MAX_CHANGE_FACTOR: ${CATALOG_SYNC_MAX_CHANGE_FACTOR:-3}
      CATALOG_SYNC_TIMEOUT_MS: ${CATALOG_SYNC_TIMEOUT_MS:-30000}
    # edge gives outbound access: alert webhooks, Slack, Telegram and SMTP servers are outside.
    networks: [internal, edge]
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  dashboard:
    image: ${REGISTRY:-dirouter}/dashboard:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/dashboard.Dockerfile
    restart: unless-stopped
    environment:
      DIROUTER_API_URL: https://admin.${DOMAIN:-localhost}/api/v1
    networks: [edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.dashboard.rule: Host(`app.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: 'true'
      traefik.http.routers.dashboard.middlewares: security-headers@file,compress@file
      traefik.http.services.dashboard.loadbalancer.server.port: '8080'

  # Documentation site (card 22.5); opt in with `--profile docs`.
  docs:
    image: ${REGISTRY:-dirouter}/docs:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/docs.Dockerfile
    profiles: [docs]
    restart: unless-stopped
    networks: [edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.docs.rule: Host(`docs.${DOMAIN:-localhost}`)
      traefik.http.routers.docs.entrypoints: websecure
      traefik.http.routers.docs.tls: 'true'
      traefik.http.routers.docs.middlewares: security-headers@file,compress@file
      traefik.http.services.docs.loadbalancer.server.port: '8080'

  portal:
    image: ${REGISTRY:-dirouter}/portal:${TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/portal.Dockerfile
    restart: unless-stopped
    environment:
      DIROUTER_API_URL: https://admin.${DOMAIN:-localhost}/api/v1
      DIROUTER_GATEWAY_URL: https://api.${DOMAIN:-localhost}
    networks: [edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dirouter_edge
      traefik.http.routers.portal.rule: Host(`portal.${DOMAIN:-localhost}`)
      traefik.http.routers.portal.entrypoints: websecure
      traefik.http.routers.portal.tls: 'true'
      traefik.http.routers.portal.middlewares: security-headers@file,compress@file
      traefik.http.services.portal.loadbalancer.server.port: '8080'

  # Mock provider for e2e and load testing (mock profile; always running in dev).
  mock-provider:
    image: ${REGISTRY:-dirouter}/mock-provider:${TAG:-latest}
    profiles: [mock]
    build:
      context: .
      dockerfile: deploy/docker/node.Dockerfile
      args: { APP: mock-provider, PORT: '8090' }
    restart: unless-stopped
    environment:
      PORT: '8090'
    networks: [edge]

  # Optional monitoring; metrics are scraped only on internal networks.
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.7.3}
    profiles: [monitoring]
    restart: unless-stopped
    user: '65534:65534'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks: [edge, internal]
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-59090}:9090'
    depends_on:
      traefik: { condition: service_healthy }
      control-api: { condition: service_started }
      gateway: { condition: service_started }
      worker: { condition: service_started }
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.2.1}
    profiles: [monitoring]
    restart: unless-stopped
    user: '472:472'
    # The password is only needed by the optional `monitoring` profile. Using
    # `:?` here would force interpolation for every compose command (even
    # `docker compose ps`), so the value is interpolated leniently and the
    # missing-password case is rejected at container start instead.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_ADMIN_PASSWORD is required for the monitoring profile" >&2
          exit 1
        fi
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_SYNC: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-53000}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'false'
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [edge]
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-53000}:3000'
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
